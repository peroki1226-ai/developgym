      function getEqName(item) {
        return item ? t(item.name) : "";
      }

      function getEqProp(item, prop) {
        return item ? t(item[prop] || "") : "";
      }

      function t(key, values = {}) {
        const language = window.gfState?.lang === "en" ? "en" : "ja";
        const detail = key.match(/^([0-9.]+)kg × (\d+) reps × (\d+) sets$/);
        const bodyweight = key.match(/^Bodyweight × (\d+) reps × (\d+) sets$/);
        const missing = key.match(
          /^Dumbbells ([0-9.]+)kg\+ \(Max (None|[0-9.]+kg)\)$/,
        );
        const required = key.match(
          /^Required Dumbbells \(([0-9.]+)kg\+\) — Gym Max: (None|[0-9.]+kg)$/,
        );
        if (detail)
          return t("{0}kg × {1} reps × {2} sets", {
            0: detail[1],
            1: detail[2],
            2: detail[3],
          });
        if (bodyweight)
          return t("Bodyweight × {0} reps × {1} sets", {
            0: bodyweight[1],
            1: bodyweight[2],
          });
        if (missing)
          return t("Dumbbells {0}kg+ (Max {1})", {
            0: missing[1],
            1: t(missing[2]),
          });
        if (required)
          return t("Required Dumbbells ({0}kg+) — Gym Max: {1}", {
            0: required[1],
            1: t(required[2]),
          });
        let template = DISPLAY_MESSAGES[language][key] ?? key;
        if (language === "ja")
          template = template
            .replace(/kcal/g, "キロカロリー")
            .replace(/kg/g, "キログラム")
            .replace(/lbs/g, "ポンド")
            .replace(/(^|[^A-Za-z])g(?![A-Za-z])/g, "$1グラム");
        return template.replace(/\{(\d+)\}/g, (match, i) =>
          Object.prototype.hasOwnProperty.call(values, i)
            ? String(values[i])
            : match,
        );
      }

        function calcMatch(gym) {
          if (state.mode === "pro") {
            const activeMenus = [
              ...DATA.proMenus.filter((m) =>
                state.proSelectedMenus.includes(m.id),
              ),
              ...state.customMenus,
            ];

            const partEquipIds = DATA.proMenus
              .filter((m) => state.proSelectedParts.includes(m.part))
              .map((m) => m.reqEquip);

            const canDoMenus = [];
            const cannotDoMenus = [];
            activeMenus.forEach((m) => {
              if (gym.installed.includes(m.reqEquip)) canDoMenus.push(m.name);
              else cannotDoMenus.push(m.name);
            });

            const menuRatio =
              activeMenus.length > 0
                ? canDoMenus.length / activeMenus.length
                : 1;
            const partRatio =
              partEquipIds.length > 0
                ? partEquipIds.filter((id) => gym.installed.includes(id))
                    .length / partEquipIds.length
                : 1;

            const dbOk =
              state.reqDumbbellKg === 0 ||
              gym.maxDumbbellKg >= state.reqDumbbellKg;
            if (!dbOk) {
              cannotDoMenus.push(
                `Required Dumbbells (${state.reqDumbbellKg}kg+) — Gym Max: ${gym.maxDumbbellKg > 0 ? `${gym.maxDumbbellKg}kg` : "None"}`,
              );
            }

            let pct = Math.round(
              (menuRatio * 0.65 + partRatio * 0.2 + (dbOk ? 0.15 : 0)) * 100,
            );
            if (
              cannotDoMenus.length === 0 &&
              activeMenus.length > 0 &&
              partRatio === 1 &&
              dbOk
            )
              pct = 99;
            return {
              pct: Math.max(15, pct),
              canDoMenus,
              cannotDoMenus,
              dbOk,
            };
          } else {
            const muscleIds = DATA.equipments
              .filter((e) => state.basicMuscles.includes(e.bodyPart))
              .map((e) => e.id);
            const wanted = state.basicEquips;
            const hitWanted = wanted.filter((id) => gym.installed.includes(id));
            const missWanted = wanted
              .filter((id) => !gym.installed.includes(id))
              .map((id) => DATA.equipments.find((e) => e.id === id)?.name);

            const dbOk =
              state.reqDumbbellKg === 0 ||
              gym.maxDumbbellKg >= state.reqDumbbellKg;
            if (!dbOk) {
              missWanted.push(
                `Dumbbells ${state.reqDumbbellKg}kg+ (Max ${gym.maxDumbbellKg > 0 ? `${gym.maxDumbbellKg}kg` : "None"})`,
              );
            }

            const wantedRatio =
              wanted.length > 0 ? hitWanted.length / wanted.length : 1;
            const muscleRatio =
              muscleIds.length > 0
                ? muscleIds.filter((id) => gym.installed.includes(id)).length /
                  muscleIds.length
                : 1;

            let pct = Math.round(
              (wantedRatio * 0.6 + muscleRatio * 0.25 + (dbOk ? 0.15 : 0)) *
                100,
            );
            if (missWanted.length === 0 && muscleRatio === 1 && dbOk) pct = 98;
            return {
              pct: Math.max(20, pct),
              canDoMenus: hitWanted.map(
                (id) => DATA.equipments.find((e) => e.id === id)?.name,
              ),
              cannotDoMenus: missWanted,
              dbOk,
            };
          }
        }

      </main>

      <!-- Sleek Floating Bottom Navigation Bar (iOS Tab Bar Style) -->
      <nav style="padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px))" class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-neutral-950/95 backdrop-blur-lg border-t border-white/10 px-2 py-2 flex items-center justify-around z-50 shadow-2xl">
        ${[
          {
            id: "finder",
            icon: "🔍",
            label: state.lang === "ja" ? t("ジム検索") : t("Gyms"),
          },
          {
            id: "guide",
            icon: "🏋️",
            label: state.lang === "ja" ? t("フォーム") : t("Guide"),
          },
          {
            id: "home",
            icon: "🏠",
            label: state.lang === "ja" ? t("家トレ") : t("Home"),
          },
          {
            id: "diet",
            icon: "🥗",
            label: state.lang === "ja" ? t("食事管理") : t("Diet"),
          },
          {
            id: "mypage",
            icon: "👤",
            label: state.lang === "ja" ? t("マイ") : t("My Page"),
          },
        ]
          .map(
            (tab) => `
          <button
            onclick="window.gf.setTab('${tab.id}')"
            class="flex-1 min-h-[48px] py-1 flex flex-col items-center gap-0.5 rounded-xl transition ${
              state.tab === tab.id
                ? "text-white font-bold"
                : "text-neutral-500 hover:text-neutral-300"
            }"
          >
            <span class="text-lg leading-none transition transform ${
              state.tab === tab.id ? "scale-110" : "opacity-70"
            }">${tab.icon}</span>
            <span class="text-[10px] tracking-tight ${state.tab === tab.id ? "text-white font-bold" : "text-neutral-400"}">${t(tab.label)}</span>
            ${state.tab === tab.id ? '<span class="w-1 h-1 rounded-full bg-white mt-0.5"></span>' : '<span class="w-1 h-1 mt-0.5"></span>'}
          </button>
        `,
          )
          .join("")}
      </nav>
    `;
        }

        window.gf = {
          toggleFilter() {
            state.showFilter = !state.showFilter;
            render();
          },
          setLang(l) {
            if (l !== "ja" && l !== "en") return;
            state.lang = l;
            try {
              localStorage.setItem("gf_lang", l);
            } catch (e) {}
            render();
          },
          setTab(t) {
            state.tab = t;
            render();
          },
          setMode(m) {
            state.mode = m;
            render();
          },
          setRegion(r) {
            state.regionFilter = r;
            render();
          },
          setSearchKeyword(v, isComposing = false) {
            state.searchKeyword = v;
            if (isComposing || searchComposing) return;
            const container = document.getElementById("gym-list-container");
            if (container) {
              container.innerHTML = renderRankedGymList(getRankedGyms());
            }
          },
          setMapType(type) {
            state.mapType = type;
            render();
          },
          selectGym(gymId) {
            state.selectedGymId = gymId;
            render();
          },
          toggleFavoriteGym(gymId) {
            state.favoriteGymIds = state.favoriteGymIds.includes(gymId)
              ? state.favoriteGymIds.filter((id) => id !== gymId)
              : [...state.favoriteGymIds, gymId];
            render();
          },
          zoom(delta) {
            state.mapZoom = Math.min(
              1.8,
              Math.max(0.8, +(state.mapZoom + delta).toFixed(2)),
            );
            render();
          },
          toggleBasicMuscle(id) {
            state.basicMuscles = state.basicMuscles.includes(id)
              ? state.basicMuscles.filter((x) => x !== id)
              : [...state.basicMuscles, id];
            render();
          },
          toggleBasicEquip(id) {
            state.basicEquips = state.basicEquips.includes(id)
              ? state.basicEquips.filter((x) => x !== id)
              : [...state.basicEquips, id];
            state.activeEquipId = id;
            render();
          },
          toggleProPart(id) {
            state.proSelectedParts = state.proSelectedParts.includes(id)
              ? state.proSelectedParts.filter((x) => x !== id)
              : [...state.proSelectedParts, id];
            render();
          },
          toggleProMenu(id) {
            state.proSelectedMenus = state.proSelectedMenus.includes(id)
              ? state.proSelectedMenus.filter((x) => x !== id)
              : [...state.proSelectedMenus, id];
            const menuObj = DATA.proMenus.find((m) => m.id === id);
            if (menuObj) state.activeEquipId = menuObj.reqEquip;
            render();
          },
          setCustomInput(v) {
            state.customMenuInput = v;
          },
          addCustomMenu() {
            const val = state.customMenuInput.trim();
            if (!val) return;
            const eqId = inferEquipFromText(val);
            state.customMenus.push({
              id: "cm-" + Date.now(),
              name: val,
              reqEquip: eqId,
            });
            state.activeEquipId = eqId;
            state.customMenuInput = "";
            render();
          },
          removeCustomMenu(id) {
            state.customMenus = state.customMenus.filter((m) => m.id !== id);
            render();
          },
          setReqDumbbell(kg) {
            state.reqDumbbellKg = kg;
            state.activeEquipId = "dumbbell-heavy";
            render();
          },
          clearPro() {
            state.proSelectedParts = [];
            state.proSelectedMenus = [];
            state.customMenus = [];
            state.reqDumbbellKg = 0;
            render();
          },
          pickMapEquip(id) {
            state.activeEquipId = id;
            render();
          },
          setFilter(f) {
            state.guideFilter = f;
            render();
          },
          setGoal(g) {
            state.workoutGoal = g;
            render();
          },
          setDuration(min) {
            state.workoutDuration = min;
            render();
          },
          setLogField(key, val) {
            state[key] = val;
          },
          addWorkoutLog() {
            const w = Number(state.logWeight) || 0;
            const r = Number(state.logReps) || 10;
            const s = Number(state.logSets) || 3;
            state.workoutHistory.unshift({
              id: "w-" + Date.now(),
              date: "Just Now",
              location:
                state.logLocation === "Home" ? "Home Workout" : "Gym Session",
              exercise: state.logExercise,
              detail: `${w > 0 ? `${w}kg` : "Bodyweight"} × ${r} reps × ${s} sets`,
              volume: (w || 40) * r * s,
            });
            render();
          },
          toggleHomeGear(id) {
            state.bodyweightOnly = false;
            state.ownedHomeGear = state.ownedHomeGear.includes(id)
              ? state.ownedHomeGear.filter((g) => g !== id)
              : [...state.ownedHomeGear, id];
            render();
          },
          toggleBodyweightOnly() {
            state.bodyweightOnly = !state.bodyweightOnly;
            render();
          },
          quickLogHome(name, setsLabel) {
            state.workoutHistory.unshift({
              id: "w-" + Date.now(),
              date: "Just Now",
              location: "Home Workout",
              exercise: name,
              detail: setsLabel,
              volume: 850,
            });
            render();
          },
          updateWeight() {
            const val = parseFloat(state.weightInput);
            if (isNaN(val) || val <= 20) return;
            state.currentWeight = +val.toFixed(1);
            state.weightHistory.push({ label: "New", kg: state.currentWeight });
            if (state.weightHistory.length > 6) state.weightHistory.shift();
            render();
          },
          quickAddMeal(name, kcal, p, f, c, provided = false) {
            state.meals.push({
              id: "ml-" + Date.now(),
              type: "Dinner",
              name,
              kcal,
              p,
              f,
              c,
              provided,
            });
            render();
          },
          aiPhotoEstimate() {
            state.meals.push({
              id: "ml-" + Date.now(),
              type: "📷 AI Photo",
              name: "AI Scanned: Grilled Steak, Brown Rice & Broccoli",
              kcal: 580,
              p: 52,
              f: 16,
              c: 55,
            });
            state.aiPhotoStatus =
              "✓ AI Vision analyzed meal photo: Estimated 580 kcal (P: 52g / F: 16g / C: 55g) added to log.";
            render();
          },
          submitUserPost() {
            const gym =
              DATA.gyms.find((g) => g.id === state.reviewGymId) || DATA.gyms[0];
            const text =
              state.reviewText.trim() ||
              "Verified equipment condition & clean floor layout.";
            const equipNote = state.reviewEquipNote.trim();
            gym.reviews.unshift({
              user: "You (Verified Contributor)",
              stars: "★★★★★",
              text: equipNote
                ? `[Equipment Spec Update: ${equipNote}] ${text}`
                : text,
            });
            if (equipNote) {
              gym.spec = `${gym.spec} / ${equipNote}`;
            }
            state.reviewText = "";
            state.reviewEquipNote = "";
            state.selectedGymId = gym.id;
            state.tab = "finder";
            render();
          },
          toggleAiCoach() {
            state.aiCoachActive = !state.aiCoachActive;
            render();
          },
        };

        document.addEventListener("compositionstart", (event) => {
          if (event.target.id === "search-keyword-input")
            searchComposing = true;
        });
        document.addEventListener("compositionend", (event) => {
          if (event.target.id === "search-keyword-input") {
            searchComposing = false;
            window.gf.setSearchKeyword(event.target.value);
          }
        });

        render();
      })();
    </script>
  </body>
</html>
