  function inferEquipFromText(text) {
    const t = text.toLowerCase();
    if (t.includes("hack") || t.includes("ハック")) return "hack-squat";
    if (t.includes("smith") || t.includes("thrust") || t.includes("スミス")) return "incline-smith";
    if (t.includes("cable") || t.includes("pushdown") || t.includes("cross") || t.includes("ケーブル")) return "cable-machine";
    if (t.includes("dumbbell") || t.includes("db") || t.includes("curl") || t.includes("raise") || t.includes("ダンベル")) return "dumbbell-heavy";
    if (t.includes("lat") || t.includes("pulldown") || t.includes("pull") || t.includes("ラット")) return "lat-pulldown";
    if (t.includes("row") || t.includes("ロー")) return "seated-row";
    if (t.includes("leg press") || t.includes("calf") || t.includes("レッグ")) return "leg-press";
    if (t.includes("pec") || t.includes("fly") || t.includes("ペック")) return "pec-fly";
    if (t.includes("chest") || t.includes("チェスト")) return "chest-press";
    if (t.includes("shoulder") || t.includes("ショルダー")) return "shoulder-press";
    if (t.includes("ab") || t.includes("crunch") || t.includes("腹")) return "abdominal-crunch";
    return "power-rack";
  }

  function calcMatch(gym) {
    if (state.mode === "pro") {
      const activeMenus = [
        ...DATA.proMenus.filter((m) => state.proSelectedMenus.includes(m.id)),
        ...state.customMenus
      ];
      const partEquipIds = DATA.proMenus
        .filter((m) => state.proSelectedParts.includes(m.part))
        .map((m) => m.reqEquip);

      const canDoMenus = [];
      const cannotDoMenus = [];
      activeMenus.forEach((m) => {
        if (gym.installed.includes(m.reqEquip)) canDoMenus.push(m.name);
        else cannotDoMenus.push(m.name);
      });

      const menuRatio = activeMenus.length > 0 ? canDoMenus.length / activeMenus.length : 1;
      const partRatio = partEquipIds.length > 0 ? partEquipIds.filter((id) => gym.installed.includes(id)).length / partEquipIds.length : 1;

      const dbOk = state.reqDumbbellKg === 0 || gym.maxDumbbellKg >= state.reqDumbbellKg;
      if (!dbOk) {
        cannotDoMenus.push(`Required Dumbbells (${state.reqDumbbellKg}kg+) — Gym Max: ${gym.maxDumbbellKg > 0 ? `${gym.maxDumbbellKg}kg` : "None"}`);
      }

      let pct = Math.round((menuRatio * 0.65 + partRatio * 0.20 + (dbOk ? 0.15 : 0)) * 100);
      if (cannotDoMenus.length === 0 && activeMenus.length > 0 && partRatio === 1 && dbOk) pct = 99;
      return {
        pct: Math.max(15, pct),
        canDoMenus,
        cannotDoMenus,
        dbOk
      };
    } else {
      const muscleIds = DATA.equipments.filter((e) => state.basicMuscles.includes(e.bodyPart)).map((e) => e.id);
      const wanted = state.basicEquips;
      const hitWanted = wanted.filter((id) => gym.installed.includes(id));
      const missWanted = wanted.filter((id) => !gym.installed.includes(id)).map((id) => DATA.equipments.find((e) => e.id === id)?.name);

      const dbOk = state.reqDumbbellKg === 0 || gym.maxDumbbellKg >= state.reqDumbbellKg;
      if (!dbOk) {
        missWanted.push(`Dumbbells ${state.reqDumbbellKg}kg+ (Max ${gym.maxDumbbellKg > 0 ? `${gym.maxDumbbellKg}kg` : "None"})`);
      }

      const wantedRatio = wanted.length > 0 ? hitWanted.length / wanted.length : 1;
      const muscleRatio = muscleIds.length > 0 ? muscleIds.filter((id) => gym.installed.includes(id)).length / muscleIds.length : 1;

      let pct = Math.round((wantedRatio * 0.6 + muscleRatio * 0.25 + (dbOk ? 0.15 : 0)) * 100);
      if (missWanted.length === 0 && muscleRatio === 1 && dbOk) pct = 98;
      return {
        pct: Math.max(20, pct),
        canDoMenus: hitWanted.map((id) => DATA.equipments.find((e) => e.id === id)?.name),
        cannotDoMenus: missWanted,
        dbOk
      };
    }
  }

            </button>
          </div>
          <!-- Language (JP / EN) -->
          <div class="flex bg-neutral-950 p-0.5 rounded-xl border border-white/15">
            <button
              onclick="window.gf.setLang('ja')"
              class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${
                state.lang === "ja" ? "bg-white text-black" : "text-neutral-400 hover:text-white"
              }"
              title="日本語 (Japanese)"
            >
              日
            </button>
            <button
              onclick="window.gf.setLang('en')"
              class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${
                state.lang === "en" ? "bg-white text-black" : "text-neutral-400 hover:text-white"
              }"
              title="English"
            >
              EN
            </button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-5 bg-black border-b border-white/15 p-1.5 gap-1">
        <button onclick="window.gf.setTab('finder')" class="py-2 rounded-xl text-[11px] font-semibold transition ${state.tab === "finder" ? "bg-white text-black luxe-white-glow" : "text-neutral-400 hover:text-white"}">${state.lang === "ja" ? "ジム検索" : "Gyms (%)"}</button>
        <button onclick="window.gf.setTab('guide')" class="py-2 rounded-xl text-[11px] font-semibold transition ${state.tab === "guide" ? "bg-white text-black luxe-white-glow" : "text-neutral-400 hover:text-white"}">${state.lang === "ja" ? "フォーム図解" : "Training"}</button>
        <button onclick="window.gf.setTab('home')" class="py-2 rounded-xl text-[11px] font-semibold transition ${state.tab === "home" ? "bg-white text-black luxe-white-glow" : "text-neutral-400 hover:text-white"}">${state.lang === "ja" ? "家トレ" : "Home Gym"}</button>
        <button onclick="window.gf.setTab('diet')" class="py-2 rounded-xl text-[11px] font-semibold transition ${state.tab === "diet" ? "bg-white text-black luxe-white-glow" : "text-neutral-400 hover:text-white"}">${state.lang === "ja" ? "食事管理" : "Diet & PFC"}</button>
        <button onclick="window.gf.setTab('mypage')" class="py-2 rounded-xl text-[11px] font-semibold transition ${state.tab === "mypage" ? "bg-white text-black luxe-white-glow" : "text-neutral-400 hover:text-white"}">${state.lang === "ja" ? "マイページ" : "My Page"}</button>
      </div>

      <div>${body}</div>
    `;
  }

  window.gf = {
    setLang(l) {
      state.lang = l;
      try {
        localStorage.setItem("gf_lang", l);
      } catch (e) {}
      render();
    },
    setTab(t) { state.tab = t; render(); },
    setMode(m) { state.mode = m; render(); },
    setRegion(r) { state.regionFilter = r; render(); },
    setSearchKeyword(v) { state.searchKeyword = v; render(); },
    setMapType(type) { state.mapType = type; render(); },
    selectGym(gymId) {
      state.selectedGymId = gymId;
      render();
    },
    toggleFavoriteGym(gymId) {
      state.favoriteGymIds = state.favoriteGymIds.includes(gymId)
        ? state.favoriteGymIds.filter((id) => id !== gymId)
        : [...state.favoriteGymIds, gymId];
      render();
    },
    zoom(delta) {
      state.mapZoom = Math.min(1.8, Math.max(0.8, +(state.mapZoom + delta).toFixed(2)));
      render();
    },
    toggleBasicMuscle(id) {
      state.basicMuscles = state.basicMuscles.includes(id) ? state.basicMuscles.filter((x) => x !== id) : [...state.basicMuscles, id];
      render();
    },
    toggleBasicEquip(id) {
      state.basicEquips = state.basicEquips.includes(id) ? state.basicEquips.filter((x) => x !== id) : [...state.basicEquips, id];
      state.activeEquipId = id;
      render();
    },
    toggleProPart(id) {
      state.proSelectedParts = state.proSelectedParts.includes(id)
        ? state.proSelectedParts.filter((x) => x !== id)
        : [...state.proSelectedParts, id];
      render();
    },
    toggleProMenu(id) {
      state.proSelectedMenus = state.proSelectedMenus.includes(id)
        ? state.proSelectedMenus.filter((x) => x !== id)
        : [...state.proSelectedMenus, id];
      const menuObj = DATA.proMenus.find((m) => m.id === id);
      if (menuObj) state.activeEquipId = menuObj.reqEquip;
      render();
    },
    setCustomInput(v) {
      state.customMenuInput = v;
    },
    addCustomMenu() {
      const val = state.customMenuInput.trim();
      if (!val) return;
      const eqId = inferEquipFromText(val);
      state.customMenus.push({
        id: "cm-" + Date.now(),
        name: val,
        reqEquip: eqId
      });
      state.activeEquipId = eqId;
      state.customMenuInput = "";
      render();
    },
    removeCustomMenu(id) {
      state.customMenus = state.customMenus.filter((m) => m.id !== id);
      render();
    },
    setReqDumbbell(kg) {
      state.reqDumbbellKg = kg;
      state.activeEquipId = "dumbbell-heavy";
      render();
    },
    clearPro() {
      state.proSelectedParts = [];
      state.proSelectedMenus = [];
      state.customMenus = [];
      state.reqDumbbellKg = 0;
      render();
    },
    pickMapEquip(id) {
      state.activeEquipId = id;
      render();
    },
    setFilter(f) {
      state.guideFilter = f;
      render();
    },
    setGoal(g) {
      state.workoutGoal = g;
      render();
    },
    setDuration(min) {
      state.workoutDuration = min;
      render();
    },
    setLogField(key, val) {
      state[key] = val;
    },
    addWorkoutLog() {
      const w = Number(state.logWeight) || 0;
      const r = Number(state.logReps) || 10;
      const s = Number(state.logSets) || 3;
      state.workoutHistory.unshift({
        id: "w-" + Date.now(),
        date: "Just Now",
        location: state.logLocation === "Home" ? "Home Workout" : "Gym Session",
        exercise: state.logExercise,
        detail: `${w > 0 ? `${w}kg` : "Bodyweight"} × ${r} reps × ${s} sets`,
        volume: (w || 40) * r * s
      });
      render();
    },
    toggleHomeGear(id) {
      state.bodyweightOnly = false;
      state.ownedHomeGear = state.ownedHomeGear.includes(id)
        ? state.ownedHomeGear.filter((g) => g !== id)
        : [...state.ownedHomeGear, id];
      render();
    },
    toggleBodyweightOnly() {
      state.bodyweightOnly = !state.bodyweightOnly;
      render();
    },
    quickLogHome(name, setsLabel) {
      state.workoutHistory.unshift({
        id: "w-" + Date.now(),
        date: "Just Now",
        location: "Home Workout",
        exercise: name,
        detail: setsLabel,
        volume: 850
      });
      render();
    },
    updateWeight() {
      const val = parseFloat(state.weightInput);
      if (isNaN(val) || val <= 20) return;
      state.currentWeight = +val.toFixed(1);
      state.weightHistory.push({ label: "New", kg: state.currentWeight });
      if (state.weightHistory.length > 6) state.weightHistory.shift();
      render();
    },
    quickAddMeal(name, kcal, p, f, c) {
      state.meals.push({ id: "ml-" + Date.now(), type: "Dinner", name, kcal, p, f, c });
      render();
    },
    aiPhotoEstimate() {
      state.meals.push({
        id: "ml-" + Date.now(),
        type: "📷 AI Photo",
        name: "AI Scanned: Grilled Steak, Brown Rice & Broccoli",
        kcal: 580,
        p: 52,
        f: 16,
        c: 55
      });
      state.aiPhotoStatus = "✓ AI Vision analyzed meal photo: Estimated 580 kcal (P: 52g / F: 16g / C: 55g) added to log.";
      render();
    },
    submitUserPost() {
      const gym = DATA.gyms.find((g) => g.id === state.reviewGymId) || DATA.gyms[0];
      const text = state.reviewText.trim() || "Verified equipment condition & clean floor layout.";
      const equipNote = state.reviewEquipNote.trim();
      gym.reviews.unshift({
        user: "You (Verified Contributor)",
        stars: "★★★★★",
        text: equipNote ? `[Equipment Spec Update: ${equipNote}] ${text}` : text
      });
      if (equipNote) {
        gym.spec = `${gym.spec} / ${equipNote}`;
      }
      state.reviewText = "";
      state.reviewEquipNote = "";
      state.selectedGymId = gym.id;
      state.tab = "finder";
      render();
    },
    toggleAiCoach() {
      state.aiCoachActive = !state.aiCoachActive;
      render();
    }
  };

  render();
})();
  </script>
</body>
</html>
